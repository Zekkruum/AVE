{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/faq.css') }}">

{% endblock %}

{% block content %}
<main class="faq-main">
    <h2>Preguntas frecuentes</h2>

    <!-- 🔍 Buscador -->
    <div class="faq-search">
        <input type="text" id="faqBuscador" placeholder="Buscar una pregunta...">
    </div>

    <div class="faq-container" id="faqContainer">
        {% for item in preguntas %}
        <div class="faq-item">
            <div class="faq-pregunta">
                <span class="faq-text">{{ item.pregunta }}</span>
                <span class="faq-toggle"></span>
            </div>

            <div class="faq-respuesta">{{ item.respuesta }}</div>
        </div>
        {% endfor %}
    </div>

    <div id="faqNoResult" class="faq-no-result">
        No se encontraron preguntas que coincidan.
    </div>

    <!-- PAGINACIÓN -->
    <div class="paginacion">
        <button id="prevBtn">Anterior</button>
        <button id="nextBtn">Siguiente</button>
    </div>
</main>

<script>
    const items = [...document.querySelectorAll('.faq-item')];
    const buscador = document.getElementById("faqBuscador");
    const noResult = document.getElementById("faqNoResult");

    let paginaActual = 1;
    const porPagina = 10;

    // 🔵 Lista filtrada independientemente del display
    let filtrados = [...items];

    function renderPagina() {
        // Oculta todo
        items.forEach(i => i.style.display = "none");

        // Calcula límites
        const inicio = (paginaActual - 1) * porPagina;
        const fin = inicio + porPagina;

        // Muestra los elementos de la página actual
        filtrados.slice(inicio, fin).forEach(i => {
            i.style.display = "block";
        });

        // Botones
        document.getElementById("prevBtn").disabled = paginaActual === 1;
        document.getElementById("nextBtn").disabled = fin >= filtrados.length;
    }

    // 🔵 Paginación
    document.getElementById("prevBtn").addEventListener("click", () => {
        if (paginaActual > 1) {
            paginaActual--;
            renderPagina();
        }
    });

    document.getElementById("nextBtn").addEventListener("click", () => {
        if ((paginaActual * porPagina) < filtrados.length) {
            paginaActual++;
            renderPagina();
        }
    });

    // 🔵 Buscador
    buscador.addEventListener("input", () => {
        const texto = buscador.value.toLowerCase();

        filtrados = items.filter(item => {
            const p = item.querySelector(".faq-text").textContent.toLowerCase();
            const r = item.querySelector(".faq-respuesta").textContent.toLowerCase();
            return p.includes(texto) || r.includes(texto);
        });

        // Mostrar mensaje si no hay resultados
        noResult.style.display = filtrados.length === 0 ? "block" : "none";

        paginaActual = 1;
        renderPagina();
    });

    // 🔵 Toggle de respuestas
    items.forEach(item => {
        const pregunta = item.querySelector('.faq-pregunta');
        const respuesta = item.querySelector('.faq-respuesta');

        pregunta.addEventListener("click", () => {
            item.classList.toggle("open");
            respuesta.style.display = respuesta.style.display === "block" ? "none" : "block";
        });
    });

    // Primera carga
    renderPagina();
</script>

{% endblock %}
