{% extends "base.html" %}

{% block content %}
<main class="container" style="max-width: 600px; margin-top: 30px;">

    <h2>Registrar incidencia</h2>
    <p>Pedido #{{ pedido.id_pago }} — Fecha: {{ pedido.fecha_pago }}</p>

    <form action="{{ url_for('registrar_incidencia_guardar', id_pedido=pedido.id_pago) }}" method="POST">

        <label>Tipo de incidencia:</label>
        <select name="tipo" required class="form-control">
            <option value="Producto dañado">Producto dañado</option>
            <option value="Producto incorrecto">Producto incorrecto</option>
            <option value="No recibido">No recibido</option>
            <option value="Error en talla">Error en talla</option>
            <option value="Otro">Otro</option>
        </select>

        <label style="margin-top: 12px;">Descripción del problema:</label>
        <textarea name="comentario" required class="form-control" rows="4"></textarea>

        <button type="submit" class="btn btn-primary" style="margin-top: 15px;">
            Enviar incidencia
        </button>
    </form>

</main>
{% endblock %}
