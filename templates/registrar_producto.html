{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/registrar.css') }}">
{% endblock %}

{% block content %}
<div class="form-container">
  <h2>Registrar Producto</h2>
  <form method="post" enctype="multipart/form-data">

    <!-- Nombre -->
    <label for="nombre">Nombre:</label>
    <input type="text" id="nombre" name="nombre" required>

    <!-- Descripción -->
    <label for="descripcion">Descripción:</label>
    <textarea id="descripcion" name="descripcion"></textarea>

    <!-- Precio -->
    <label for="precio">Precio:</label>
    <input type="number" id="precio" step="0.01" name="precio">

    <!-- Peso -->
    <label for="peso">Peso (g):</label>
    <input type="number" id="peso" step="0.01" name="peso">

    <!-- Alto -->
    <label for="alto">Alto (cm):</label>
    <input type="number" id="alto" step="0.01" name="alto">

    <!-- Ancho -->
    <label for="ancho">Ancho (cm):</label>
    <input type="number" id="ancho" step="0.01" name="ancho">

    <!-- Largo -->
    <label for="largo">Largo (cm):</label>
    <input type="number" id="largo" step="0.01" name="largo">

    <!-- Tipo de joya -->
    <label for="id_tipo">Tipo de joya:</label>
    <select id="id_tipo" name="id_tipo" required>
      <option value="">-- Selecciona un tipo --</option>
      {% for tipo in tipos %}
      <option value="{{ tipo.id_tipo }}">{{ tipo.nombre_tipo }}</option>
      {% endfor %}
    </select>

    <!-- Material -->
    <label for="id_material">Material:</label>
    <select id="id_material" name="id_material" required>
      <option value="">-- Selecciona un material --</option>
      {% for material in materiales %}
      <option value="{{ material.id_material }}">{{ material.nombre_material }}</option>
      {% endfor %}
    </select>

    <!-- Color -->
    <label for="id_color">Color del producto:</label>
    <select id="id_color" name="id_color">
      <option value="">-- Selecciona un color --</option>
      {% for color in colores %}
      <option value="{{ color.id_color }}">{{ color.nombre }}</option>
      {% endfor %}
    </select>

    <!-- Piedras -->
    <label for="id_piedra">Tipo de piedra (si aplica):</label>
    <select id="id_piedra" name="id_piedra" disabled>
      <option value="">-- Selecciona una piedra --</option>
      {% for piedra in piedras %}
      <option value="{{ piedra.id_piedra }}">{{ piedra.nombre }}</option>
      {% endfor %}
    </select>

    <!-- Stock por talla -->
    <div id="tallas-container">
      <h4>Tallas y Stock</h4>
      <div class="talla-row">
        <input type="text" name="talla[]" placeholder="Talla" required>
        <input type="number" name="stock[]" placeholder="Stock" min="5" required>
        <button type="button" onclick="removeRow(this)">Eliminar</button>
      </div>
    </div>
    <button type="button" onclick="addRow()">Añadir otra talla</button>

    <!-- Imágenes -->
    <label for="imagenes">Imágenes:</label>
    <input type="file" id="imagenes" name="imagenes" multiple onchange="previewImages()">

    <!-- Código único -->
    <label for="codigo_producto_visible">Código único del producto:</label>
<input type="text" id="codigo_producto_visible" value="{{ codigo_producto }}" readonly class="codigo-box">

<!-- Campo real que viaja al backend -->
<input type="hidden" id="codigo_producto" name="codigo_producto" value="{{ codigo_producto }}">


    <!-- Preview de imágenes -->
    <div id="preview" class="image-preview"></div>

    <!-- Botón -->
    <button type="submit" class="btn-submit">Guardar</button>
  </form>
</div>

<!-- JS dinámico -->
<script>
  // Activar select de piedras solo si se selecciona "Piedra preciosa"
  const materialSelect = document.getElementById('id_material');
  const piedraSelect = document.getElementById('id_piedra');

  materialSelect.addEventListener('change', function () {
    if (this.value === '4') { // Piedra preciosa
      piedraSelect.disabled = false;
      piedraSelect.required = true;
    } else {
      piedraSelect.disabled = true;
      piedraSelect.required = false;
      piedraSelect.value = "";
    }
  });

  // Añadir/eliminar tallas
  function addRow() {
    const container = document.getElementById("tallas-container");
    const div = document.createElement("div");
    div.classList.add("talla-row");
    div.innerHTML = `
      <input type="text" name="talla[]" placeholder="Talla" required>
      <input type="number" name="stock[]" placeholder="Stock" min="0" required>
      <button type="button" onclick="removeRow(this)">Eliminar</button>
    `;
    container.appendChild(div);
  }

  function removeRow(button) {
    button.parentElement.remove();
  }

  // Preview de imágenes
  function previewImages() {
    const preview = document.getElementById("preview");
    preview.innerHTML = "";
    const files = document.getElementById("imagenes").files;

    if (files) {
      Array.from(files).forEach(file => {
        const reader = new FileReader();
        reader.onload = e => {
          const img = document.createElement("img");
          img.src = e.target.result;
          img.classList.add("preview-img");
          preview.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }
  }
</script>
{% endblock %}
