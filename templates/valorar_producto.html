{% extends "base.html" %}
{% block content %}

<link rel="stylesheet" href="{{ url_for('static', filename='css/valorar_producto.css') }}">

<div class="valoracion-container">
    <h1 class="titulo">💎 Valorar Producto</h1>

    <form class="valoracion-form"
          action="{{ url_for('guardar_valoracion', id_producto=id_producto) }}"
          method="POST">

        <!-- CALIFICACIÓN -->
        <label class="label">Calificación:</label>
        <select name="calificacion" class="select" required>
            <option value="">Seleccione</option>
            <option value="1">⭐</option>
            <option value="2">⭐⭐</option>
            <option value="3">⭐⭐⭐</option>
            <option value="4">⭐⭐⭐⭐</option>
            <option value="5">⭐⭐⭐⭐⭐</option>
        </select>

        <!-- COMENTARIO -->
        <label class="label">Comentario:</label>
        <textarea name="comentario" maxlength="500" class="textarea"></textarea>

        <!-- BOTÓN -->
        <button type="submit" class="btn-enviar">Enviar valoración</button>

    </form>
</div>

{% endblock %}
